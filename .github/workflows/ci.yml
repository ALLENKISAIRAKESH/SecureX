name: SecureX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Seed Database
      run: npm run seed
      env:
        MONGO_URI: mongodb://localhost:27017/securex
        JWT_SECRET: test_ci_secret_key_2026

    - name: Start Application and Run Automated Integration Tests
      run: |
        npm start &
        sleep 5
        npm test
      env:
        PORT: 3000
        MONGO_URI: mongodb://localhost:27017/securex
        JWT_SECRET: test_ci_secret_key_2026
